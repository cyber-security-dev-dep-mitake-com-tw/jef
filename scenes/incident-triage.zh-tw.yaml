scene: incident-triage
version: 2
description: >-
  資安事件分流：先濾掉已知良性樣態與證據不足的告警，再決定團隊與急迫性。
  三層閘門共用同一次 state 編碼。

# 保守的信心門檻。這些數字應該讀自 report.json 裡 P(correct) 的可靠度曲線，
# 而不是憑感覺挑的——未校準的機率上設門檻等於擲硬幣。
#
# 每一題都宣告 task_id。校準是按任務查的，不是按答案形狀：一個 noul:2 的
# 「是否誤報」不能借用另一個 noul:2 任務的溫度和分位數。task_id 對應訓練語料
# 的 source（soar_zh.*），沒有對應語料的題（evidence_sufficiency）在校準完成
# 前會是 missing，相關閘門因此交由人工——這是刻意的。
alpha: 0.10

# 每層都走完而沒有任何閘門命中時的歸宿。預設是升級給人，
# 因為一個跑到底卻沒做出決定的 playbook，並沒有做出決定。
fallthrough: escalate_human

# 閘門讀到的題目若未經此任務校準驗證（legacy／missing／insufficient），
# 引擎不會提出閘門選的動作，而是改提 unvalidated_fallback，並在 trace 標
# advisory_only 與 withheld_action。未校準的機率只能當觀察，不能變成
# 「高度疑似良性、建議關閉」這種看似有把握的建議。允許清單按動作名稱比對，
# 改名繞不過去；清單內的動作必須是人工覆核且 T1 以下。升級給人（含呼叫值班）
# 不是狀態改變，未校準也可以提出；它只會讓人更早看到，不會讓告警被關掉。
advisory:
  unvalidated_fallback: escalate_human
  allowed_when_unvalidated: [escalate_human, queue_for_review, page_oncall]
  # 照常詢問並寫入 trace 供分析，但在校準驗證前沒有閘門讀它。
  observe_only: [is_false_positive]

layers:
  - id: L1-noise-filter
    description: 先處理最便宜也最常見的情況：這則告警根本不需要人看。
    questions:
      is_false_positive:
        task_id: soar_zh.false_positive.v1
        type: noul
        instructions: 這則告警是否為已知的良性樣態（誤報）？
        criteria:
          true: 為既有排程、核准作業或既知良性行為
          false: 為真實事件，需進一步處理
      has_evidence:
        task_id: soar_zh.evidence_sufficiency.v1
        type: noul
        instructions: 告警內容是否包含足以做出判斷的具體證據？
        criteria:
          true: 含主機、帳號、時間或行為等可據以判斷的細節
          false: 僅有結論性描述，缺乏可驗證的細節
    gates:
      # 原本這裡有「is_false_positive.probability > 0.90 → close_pending_review」。
      # 0.90 是未校準的原始機率：K8S Lab（2026-10-20）一則 Windows 修補告警以
      # 0.92 命中，被寫成「高度疑似良性、建議關閉」，而勒索軟體告警的 0.85 與它
      # 只差一點。關閉建議在下列條件全部具備前不重新加入（見
      # docs/validation/plans/2026-10-20-incident-triage-validation-first.md）：
      #   1. is_false_positive.calibration_status == "validated"（Schema 2、此任務）
      #   2. is_false_positive.p_correct is not None
      #   3. P(誤報=true) 超過在獨立 holdout 上量測、事先登記的門檻
      #   4. state 內有核准變更單／例行作業的佐證；缺佐證判 unknown，不判良性
      #   5. 仍是 human_review: true、T2，由人確認後才關閉
      # 證據不足時不猜。猜出來的答案會帶著同樣的信心分數往下傳，
      # 而下游閘門無從分辨「有把握」與「沒東西可看」。
      # 自動回頭要資料雖然只是 T1 動作，仍要求這題的 bucket 已校準驗證；
      # 否則 0.40 這個門檻沒有意義，runtime policy 也會把它改為人工覆核。
      - when: 'has_evidence.calibration_status == "validated" and has_evidence.probability < 0.40'
        then: request_context
        because: 證據不足，回頭要資料而非硬猜
      - else: true
        then: next

  - id: L2-routing
    description: 決定歸屬團隊與嚴重度。
    questions:
      owner:
        task_id: soar_zh.routing.v1
        type: choice
        instructions: 這則告警應由哪一個團隊處理？
        criteria:
          soc: 一般資安監控事件：告警分流、惡意連線、端點偵測
          appsec: 應用程式與程式碼相關：網頁漏洞、API 濫用、相依套件風險
          infra: 基礎設施層：主機、網路設備、憑證、備份與可用性
          identity: 身分與存取管理：帳號、權限、單一登入、特權帳號
          fraud: 金融詐欺與異常交易：盜用帳戶、異常下單、洗錢態樣
      severity:
        task_id: soar_zh.severity.v1
        type: score
        instructions: 評估這則告警的嚴重程度。
        criteria: [資訊, 低, 中, 高, 危急]
    gates:
      # 自動指派要求的是「答對的機率」，不是分布有多尖。
      # p_correct 為 None 代表該 bucket 的校準資料不足以誠實回答，
      # 這時就不該自動指派——那與「機率很低」是兩回事。
      - when: 'owner.p_correct is not None and owner.p_correct >= 0.95 and severity.score >= 3.0'
        then: page_oncall
        because: 歸屬明確且嚴重度高，直接叫人
      - when: 'owner.p_correct is not None and owner.p_correct >= 0.85 and owner.set_size == 1'
        then: assign
        because: 歸屬明確且 conformal 集合唯一，可自動指派
      - when: 'owner.set_size > 2'
        then: escalate_human
        because: 模型無法在承諾的覆蓋率下分辨團隊，交給人
      - else: true
        then: next

  - id: L3-urgency
    description: 歸屬不夠明確時，至少判斷要不要現在處理。
    questions:
      urgent:
        task_id: soar_zh.urgency.v1
        type: noul
        instructions: 這則告警是否需要立即處理？
        criteria:
          true: 正在造成損害或即將造成損害
          false: 可依既有排程處理
    gates:
      - when: 'urgent.probability > 0.80'
        then: escalate_human
        because: 急迫但歸屬不明，需人工即刻判斷
      - else: true
        then: queue_for_review

actions:
  request_context:
    description: 證據不足，向來源系統索取更多脈絡
    human_review: false
    params: { queue: enrichment }
  assign:
    description: 自動指派給歸屬團隊
    human_review: false
    params: { queue: team_inbox }
  page_oncall:
    description: 呼叫值班人員
    human_review: true
    params: { queue: oncall, priority: p1 }
  escalate_human:
    description: 交由資安分析師人工判斷
    human_review: true
    params: { queue: analyst_review }
  queue_for_review:
    description: 排入一般待審佇列
    human_review: true
    params: { queue: backlog }
