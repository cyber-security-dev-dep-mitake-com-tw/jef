name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The deployment target is a CPU-only 16 vCPU Proxmox VM, so CI stays CPU-only
  # too -- nothing here may quietly start depending on a GPU.
  JEF_BACKBONE: hashing

jobs:
  python:
    name: python (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages --no-install-package torch --no-install-package transformers
      - name: Lint
        run: uv run ruff check packages/
      - name: Format check
        run: uv run ruff format --check packages/
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest packages/ -q --cov=packages --cov-report=term-missing

  contract:
    name: /v1/systemone conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --no-install-package torch --no-install-package transformers
      - name: Robot Framework acceptance
        run: PY="$(pwd)/.venv/bin/python" ./scripts/run-acceptance.sh

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: test/results/
          retention-days: 7

  go:
    name: go (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, acceptance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: packages/jef-go/go.sum

      - name: Vet
        working-directory: packages/jef-go
        run: go vet ./...

      - name: Gofmt
        working-directory: packages/jef-go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for: $unformatted"
            exit 1
          fi

      # The golden fixtures are the parity contract. They are committed, so a
      # change to the Python maths that is not reflected here fails the Go
      # tests -- which is the point.
      - name: Cross-language parity (golden fixtures)
        if: matrix.suite == 'unit'
        working-directory: packages/jef-go
        run: go test ./... -v

      - uses: astral-sh/setup-uv@v5
        if: matrix.suite == 'acceptance'
        with:
          enable-cache: true
      - name: Sync python
        if: matrix.suite == 'acceptance'
        run: uv sync --all-packages --no-install-package torch --no-install-package transformers

      - name: Acceptance against the Go server
        if: matrix.suite == 'acceptance'
        run: JEF_RUNTIME=go PY="$(pwd)/.venv/bin/python" ./scripts/run-acceptance.sh

      # Golden fixtures pin the maths; this exercises both full HTTP stacks
      # against each other -- parsing, state rendering, option order, dialect
      # echo and JSON shape.
      - name: Both servers answer identically
        if: matrix.suite == 'acceptance'
        run: |
          JEF_SCENES_DIR=scenes .venv/bin/python -m jef_server &
          go build -o /tmp/jef-server-go ./packages/jef-go/cmd/jef-server 2>/dev/null \
            || (cd packages/jef-go && go build -o /tmp/jef-server-go ./cmd/jef-server)
          JEF_ADDR=:8090 /tmp/jef-server-go &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null 2>&1 \
              && curl -sf http://127.0.0.1:8090/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          .venv/bin/python scripts/check-parity.py

      - name: Upload report
        if: always() && matrix.suite == 'acceptance'
        uses: actions/upload-artifact@v4
        with:
          name: robot-report-go
          path: test/results-go/
          retention-days: 7

  docker:
    name: image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t jef:ci .
      - name: Run and probe
        run: |
          docker run -d --name jef-ci -p 8080:8080 jef:ci
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"'; then
            echo "::error::container never became healthy; logs follow"
            docker logs jef-ci
            docker inspect --format '{{.State.Status}} exit={{.State.ExitCode}}' jef-ci
            exit 1
          fi

      - name: Container logs
        if: always()
        run: docker logs jef-ci 2>&1 | tail -50 || true

      - name: Clean up
        if: always()
        run: docker rm -f jef-ci || true
