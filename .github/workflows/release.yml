name: Release

# Tag-driven and lockstep: `git tag v0.2.0 && git push --tags` publishes every
# package at that version. A tag ending in rcN goes to TestPyPI and npm's `next`
# tag instead of the real registries, so the pipeline can be rehearsed without
# burning a version number -- PyPI and npm both refuse to reuse one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify against (no publishing)"
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      minor: ${{ steps.resolve.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The moving tag, for the container only. Computed here rather than
          # by docker/metadata-action's {{major}}.{{minor}}, which only comes
          # from its semver parser -- and that parser rejects PEP 440.
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          case "$version" in
            *rc*|*a*|*b*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)            echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Releasing $version"

      # A tag that disagrees with the files is the one mistake that cannot be
      # undone after publishing, so it stops everything before anything is built.
      # stdlib only, so it runs before any dependency is installed -- a tag
      # that disagrees with the files should fail in seconds, not after a sync.
      - name: Tag matches the packages
        run: |
          python scripts/set-version.py --check "${{ steps.resolve.outputs.version }}" || {
            echo "::error::tag and pyproject versions disagree. Run: python scripts/set-version.py ${{ steps.resolve.outputs.version }}"
            exit 1
          }

      - name: Sync
        run: uv sync --all-packages --no-install-package torch --no-install-package transformers

      - name: Lint, types, tests
        run: |
          uv run ruff check packages/ connectors/ scripts/ test/ tests/
          uv run ruff format --check packages/ connectors/ scripts/ test/ tests/
          uv run mypy
          uv run pytest -q

      - name: Scenes lint clean
        run: uv run jef validate scenes/

  build-python:
    name: build python
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # One directory per distribution, so each publish job can point at its
      # own without globbing: PyPI requires a separate trusted publisher per
      # project (see the environment note below), so they upload separately.
      - name: Build every distribution
        run: |
          set -e
          for project in jef jef-server jef-train; do
            uv build "packages/$project" -o "dist/$project"
          done
          find dist -type f | sort

      # Catches a broken long_description or a malformed classifier before
      # upload, where PyPI's rejection message is far less specific.
      # dist/*/* , not dist/* : the distributions each build into their own
      # directory so the publish jobs can point at one without globbing, and
      # `twine check dist/*` hands twine a directory -- "Unknown distribution
      # format: 'jef'".
      - name: Validate metadata
        run: uvx twine check dist/*/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  # Installs what is about to be published, from the artifact, into a venv that
  # has none of this repository on its path. The workspace install puts all
  # four modules on sys.path from source no matter what the wheel contains, so
  # nothing else here would notice `jef` shipping an engine with no scenes, a
  # missing console script, or the jef <-> jef-server dependency cycle failing
  # to resolve. An upload cannot be taken back, so this gates it.
  smoke:
    name: installs from the built artifact
    # verify too, not just build-python: `needs.verify.outputs.version` is only
    # in scope for jobs that declare it, and an out-of-scope expression is the
    # empty string -- `pip install "jef[server]=="`, which fails obscurely.
    needs: [verify, build-python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4      # for scenes/, nothing else
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: pip install jef[server]
        run: |
          set -e
          python -m venv /tmp/smoke
          # --find-links for the local wheels; the index stays reachable so
          # third-party dependencies still resolve.
          /tmp/smoke/bin/pip install -q --find-links dist/jef --find-links dist/jef-server \
            "jef[server]==${{ needs.verify.outputs.version }}"

      - name: The four modules, the console script, and the server
        run: |
          set -e
          /tmp/smoke/bin/python -c "import jef_core, jef_scene, jef_sdk, jef_cli, jef_server.factory"
          /tmp/smoke/bin/jef validate scenes/
          # --local, because the commands default to a server on localhost and
          # this job has none. Without it the first run of this job failed on
          # "connection refused" -- and so would every first-time user.
          /tmp/smoke/bin/jef models --local
          /tmp/smoke/bin/jef ask "付款連續三天失敗" --local --yes-no "是否緊急？"
          test -x /tmp/smoke/bin/jef-mcp

  pypi:
    name: ${{ matrix.project }} → ${{ needs.verify.outputs.prerelease == 'true' && 'TestPyPI' || 'PyPI' }}
    needs: [verify, build-python, smoke]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [jef, jef-server, jef-train]
    # One environment per project, and that is not cosmetic. PyPI's pending
    # publishers are unique on (owner, repository, workflow, environment), so a
    # monorepo publishing several projects from one workflow can only register
    # one pending publisher unless the environment differs -- the rest are
    # rejected as duplicates. See pypi/warehouse#16920. A second, separate
    # limit caps a user at three pending publishers at once, which is why this
    # repo ships three distributions rather than six.
    environment: ${{ needs.verify.outputs.prerelease == 'true' && 'testpypi-' || 'pypi-' }}${{ matrix.project }}
    permissions:
      # Trusted Publishing: OIDC instead of a long-lived API token, so there is
      # no PyPI credential in this repository at all.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish ${{ matrix.project }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/${{ matrix.project }}
          repository-url: ${{ needs.verify.outputs.prerelease == 'true' && 'https://test.pypi.org/legacy/' || '' }}
          # An rc rehearsal may hit a version TestPyPI already has; that should
          # not fail the run. Real releases never skip.
          skip-existing: ${{ needs.verify.outputs.prerelease }}

  npm:
    name: publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # Provenance: npm records which workflow and commit produced the tarball.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # NPM_TOKEN must be an *automation* token (classic) or a granular access
      # token. A classic "publish" token still demands a one-time password, and
      # the publish dies with `EOTP` -- which reads like a missing 2FA code
      # rather than the wrong kind of token.
      - name: The token can publish without a one-time password
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm whoami || {
            echo "::error::NPM_TOKEN is not valid for this registry"
            exit 1
          }

      - name: Build and publish @jef-ai/sdk
        working-directory: packages/jef-sdk-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install
          npm run typecheck && npm test && npm run build
          npm publish --provenance --access public \
            --tag ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}

      - name: Build and publish n8n-nodes-jef
        working-directory: connectors/n8n
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install
          npm run typecheck && npm run build
          npm publish --provenance --access public \
            --tag ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}

  ghcr:
    name: publish container
    # Not gated on pypi: the Dockerfile installs from ./packages in the build
    # context, not from the index. An earlier comment here claimed otherwise,
    # which would have made a partial PyPI failure block the image for no
    # reason.
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # raw, not semver: `type=semver` runs the tag through a strict
          # semver parser, and `0.2.0rc1` is PEP 440. It does not fail -- it
          # quietly emits no tag, so the image went up as sha-<short> only and
          # the probe below pulled a manifest that did not exist.
          #
          # The moving tags are withheld from prereleases on purpose: an rc
          # should never become what `:0.2` or `:latest` resolves to.
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=${{ needs.verify.outputs.minor }},enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 matters here: the Proxmox and Apple Silicon paths in Infra/
          # both assume it exists.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The published image actually serves
        run: |
          image="ghcr.io/${{ github.repository }}:${{ needs.verify.outputs.version }}"
          docker run -d --name probe -p 8080:8080 "$image"
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"' || {
            docker logs probe
            exit 1
          }
          docker rm -f probe

  weights:
    name: publish weights
    needs: verify
    runs-on: ubuntu-latest
    # The head is ~400KB because only it is trained -- the backbone is frozen
    # and comes from Hugging Face at runtime. That is small enough to live in
    # git, so CI always has something to publish. (Laya ships ~800MB for the
    # same reason in reverse: it fine-tunes the encoder.)
    #
    # Still guarded: a checkout without weights should skip this job, not fail
    # the release.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Look for trained artifacts
        id: check
        run: |
          if [ -f models/jef-v0/head.npz ] && [ -f models/jef-v0/calibration.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no trained weights in models/jef-v0; skipping the weights job"
          fi

      # Symmetric with the npm preflight. The first rehearsal reached
      # `api/repos/create` and came back 403, which reads like the repo is
      # protected rather than like the token cannot write.
      - name: The token can write
        if: steps.check.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run --no-project --with huggingface_hub python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi
          token = os.environ.get("HF_TOKEN")
          if not token:
              sys.exit("::error::HF_TOKEN is not set")
          me = HfApi().whoami(token=token)
          scopes = (me.get("auth") or {}).get("accessToken", {}).get("role")
          print(f"authenticated as {me.get('name')} (role={scopes})")
          if scopes == "read":
              sys.exit(
                  "::error::HF_TOKEN is read-only; publishing needs a write token "
                  "that may create repos under this account"
              )
          PY

      - name: Publish to Hugging Face
        if: steps.check.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # `uv run` at the workspace root syncs the root project, which is a
          # virtual package with no members, so jef_train was never importable
          # here -- ModuleNotFoundError after two minutes of installing.
          #
          # --no-project plus PYTHONPATH instead of --package jef-train: this
          # module is stdlib and huggingface_hub only (tested), and
          # --package would pull torch and transformers to upload 400KB.
          PYTHONPATH=packages/jef-train/src \
          uv run --no-project --with huggingface_hub python -m jef_train.publish_weights \
            --model-dir models/jef-v0 \
            --repo dennislee928/jef-v0 \
            --version "${{ needs.verify.outputs.version }}"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.present == 'true'
        with:
          name: weights
          path: |
            models/jef-v0/head.npz
            models/jef-v0/calibration.json
            models/jef-v0/report.json

  github-release:
    name: github release
    needs: [verify, pypi, npm, ghcr, weights]
    if: always() && needs.pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      # The notes lead with what each channel actually did. v0.2.0rc3 shipped
      # with no weights attached and nothing on npm, and said neither -- the
      # asset list just quietly lacked head.npz. A release that names only the
      # tag invites the reader to assume everything in it worked.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYPI_RESULT: ${{ needs.pypi.result }}
          NPM_RESULT: ${{ needs.npm.result }}
          GHCR_RESULT: ${{ needs.ghcr.result }}
          WEIGHTS_RESULT: ${{ needs.weights.result }}
          IS_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -e
          version="${{ needs.verify.outputs.version }}"
          index=$([ "$IS_PRERELEASE" = "true" ] && echo TestPyPI || echo PyPI)
          npm_tag=$([ "$IS_PRERELEASE" = "true" ] && echo "npm \`next\`" || echo "npm")

          mark() {
            case "$1" in
              success) echo "shipped" ;;
              skipped) echo "**skipped**" ;;
              *)       echo "**FAILED — nothing published here**" ;;
            esac
          }

          {
            echo "| Channel | |"
            echo "|---|---|"
            echo "| $index | $(mark "$PYPI_RESULT") |"
            echo "| $npm_tag | $(mark "$NPM_RESULT") |"
            echo "| GHCR image | $(mark "$GHCR_RESULT") |"
            echo "| Hugging Face weights | $(mark "$WEIGHTS_RESULT") |"
            echo
            if [ "$WEIGHTS_RESULT" != "success" ]; then
              echo "> Without the weights this build cannot automate anything:"
              echo "> \`p_correct\` is unavailable and every scene gate routes to a human."
              echo
            fi
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="v${version}" --jq .body
          } > notes.md

          files=$(find artifacts -type f 2>/dev/null | tr '\n' ' ')
          gh release create "v${version}" $files \
            --title "v${version}" \
            --notes-file notes.md \
            ${{ needs.verify.outputs.prerelease == 'true' && '--prerelease' || '' }}
