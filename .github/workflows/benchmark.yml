name: Benchmark

# Nightly, against datasets this project did not construct.
#
# The ecosystem's credibility problem is that everyone publishes their own
# benchmark and never runs it again. Running these on a schedule means the
# numbers in docs/ describe the current model rather than the one that happened
# to be checked in when someone last wrote a README -- and the corpus is rebuilt
# from live NVD data, so they genuinely drift.
#
# Results leave this workflow as an artifact pinned to the commit that produced
# them, never as a push to main. Pushing raced with every other merge (run
# 39018107664 computed everything, then failed on a non-fast-forward push) and
# put unreviewed numbers on main. To publish a run, start benchmark-publish.yml
# with its run id: it verifies the artifact and opens a pull request.
on:
  schedule:
    # 03:00 UTC = 11:00 Taipei, after the working day's commits have landed.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      context_sweep:
        description: "Also run the long-context sweep (slow)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  third-party:
    name: third-party benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync with the real backbone
        run: uv sync --all-packages

      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-mmbert-v1
          restore-keys: hf-${{ runner.os }}-

      - name: Weights present
        id: weights
        run: |
          if [ -f models/jef-v0/head.npz ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no weights in models/jef-v0; benchmarks would measure the zero-shot head"
          fi

      # The corpus supplies the CVE exclusion list: CTI-Bench VSP is NVD-derived
      # and so is the training corpus, so anything seen in training must be
      # filtered before it is scored.
      - name: Rebuild the corpus for the exclusion list
        if: steps.weights.outputs.present == 'true'
        run: uv run python -m jef_train.build_corpus --out data/corpus --cve-records 3000

      - name: Run
        if: steps.weights.outputs.present == 'true'
        run: |
          uv run python -m jef_train.bench \
            --model-dir models/jef-v0 \
            --corpus data/corpus \
            --out docs/benchmarks.json \
            --tmmlu-per-subject 8 \
            --cti-mcq-limit 300 \
            --cti-vsp-limit 250

      - name: Long-context sweep
        if: steps.weights.outputs.present == 'true' && inputs.context_sweep
        run: |
          uv run python -m jef_train.bench \
            --model-dir models/jef-v0 --corpus data/corpus \
            --context-sweep --sweep-cases 30 \
            --tmmlu-per-subject 0 --cti-mcq-limit 0 --cti-vsp-limit 80 \
            --out docs/benchmarks.json

      - name: Regenerate the badge
        if: steps.weights.outputs.present == 'true'
        run: uv run python scripts/benchmark-badge.py

      - name: Pin the results to this run
        if: steps.weights.outputs.present == 'true'
        run: |
          paths="docs/benchmarks.json docs/badges"
          [ -f docs/context-sweep.json ] && paths="$paths docs/context-sweep.json"
          python scripts/benchmark-manifest.py write $paths \
            --out docs/benchmark-manifest.json \
            --source-sha "${{ github.sha }}" --run-id "${{ github.run_id }}"

      # Uploaded, not pushed. benchmark-publish.yml turns a chosen run into a
      # reviewed pull request; nothing here writes to the repository.
      - name: Upload benchmark evidence
        if: steps.weights.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.sha }}-${{ github.run_id }}
          path: |
            docs/benchmarks.json
            docs/context-sweep.json
            docs/badges/
            docs/benchmark-manifest.json
          if-no-files-found: error
          retention-days: 90
