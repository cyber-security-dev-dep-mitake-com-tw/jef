# Shadow-only lab: JEF, a persistent decision store, and mock targets.
# Nothing here reaches a production system. The network is internal (no
# default route), so even a misconfigured connector cannot leave the host.
# Docker does not publish ports for containers on an internal-only network,
# so nothing here is reachable from the host either: talk to JEF from inside
# (`docker compose exec`, or the mock-soar service below). CI asserts this.
#
#   docker compose -f deploy/lab/docker-compose.yml up --build -d
#   docker compose -f deploy/lab/docker-compose.yml exec jef python -c \
#     "import urllib.request as u; print(u.urlopen('http://127.0.0.1:8080/readyz').read().decode())"
#
# Secrets below are lab placeholders. Inject real ones from a secret manager
# for anything beyond this compose file.
name: jef-lab
networks:
  lab:
    internal: true   # no egress; the host's published ports are the only way in
services:
  jef:
    image: jef-lab:local
    build:
      context: ../..
      args:
        JEF_EXTRAS: ""          # "torch" for the real backbone; stage weights first
    environment:
      JEF_BACKBONE: hashing     # replace with jhu-clsp/mmBERT-base + staged weights
      JEF_SCENES_DIR: /app/scenes
      JEF_API_KEYS: "lab:lab-only-not-a-secret"
      JEF_RATE_LIMIT_PER_MINUTE: "60"
      JEF_MAX_BODY_BYTES: "2000000"
      JEF_MAX_JSON_DEPTH: "16"
      JEF_MAX_QUESTIONS: "24"
      JEF_MAX_STATE_CHARS: "200000"
      JEF_METRICS_PUBLIC: "0"
      # Decisions on, so authorize/complete can be exercised against the mocks;
      # grants come from the approval stub below. Still shadow: nothing acts.
      JEF_DECISIONS_ENABLED: "1"
      JEF_GRANT_SECRET: "lab-grant-secret-not-for-production"
      JEF_PROPOSAL_SECRET: "lab-proposal-secret-not-for-production"
      JEF_DECISION_STORE: "sqlite:////var/lib/jef/decisions.db"
      JEF_REQUIRED_TASK_IDS: "soc.alert.verdict.v1,soc.ndr.technique.v1"
      JEF_WORKERS: "1"
    volumes:
      - decisions:/var/lib/jef
    networks: [lab]
  mock-targets:
    image: python:3.12-slim
    command: ["python", "/lab/mock_targets.py", "--host", "0.0.0.0", "--port", "9009"]
    volumes:
      - ./mock_targets.py:/lab/mock_targets.py:ro
    networks: [lab]
  # The safety matrix, end to end: plays the SOAR connector and the approval
  # stub against jef and mock-targets from inside the lab network. Profile-
  # gated, so `up` alone does not start it. CI runs its phases in order:
  #   docker compose --profile soar run --rm mock-soar matrix
  #   docker compose restart jef
  #   docker compose --profile soar run --rm mock-soar after-restart
  mock-soar:
    profiles: ["soar"]
    image: jef-lab:local          # the jef image: it ships jef_scene for grant signing
    entrypoint: ["python", "/lab/mock_soar.py"]
    command: ["matrix"]
    environment:
      JEF_URL: http://jef:8080
      TARGETS_URL: http://mock-targets:9009
      JEF_API_KEY: "lab-only-not-a-secret"                   # must match JEF_API_KEYS above
      JEF_GRANT_SECRET: "lab-grant-secret-not-for-production"  # the approval stub's key
      SOAR_OUT: /out
    volumes:
      - ./mock_soar.py:/lab/mock_soar.py:ro
      - ${SOAR_OUT_DIR:-./soar-out}:/out
    depends_on: [jef, mock-targets]
    networks: [lab]
volumes:
  decisions: {}
