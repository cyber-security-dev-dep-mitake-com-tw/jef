[project]
name = "jef-workspace"
version = "0.0.0"
description = "JEF — open System One decision engine (workspace root)"
requires-python = ">=3.12,<3.14"

[tool.uv.workspace]
members = ["packages/jef-core", "packages/jef-train", "packages/jef-server", "packages/jef-scene", "packages/jef-sdk-python"]

[tool.uv.sources]
jef-core  = { workspace = true }
jef-scene = { workspace = true }
jef-train = { workspace = true }
jef-server = { workspace = true }
jef-sdk    = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.28",
  "robotframework>=7.1",
  "robotframework-requests>=0.9.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/jef-ui", "packages/jef-sdk-ts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 flag fullwidth CJK punctuation as "ambiguous". zh-TW is a
# first-class language in this project, so 。！？（） are correct, not typos.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]  # asserts are the point of a test

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["packages/jef-core/src", "packages/jef-scene/src", "packages/jef-server/src", "packages/jef-sdk-python/src", "packages/jef-train/src"]

[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
addopts = "-q"
