[project]
name = "jef-workspace"
version = "0.0.0"
description = "JEF — open System One decision engine (workspace root)"
requires-python = ">=3.12,<3.14"

[tool.uv.workspace]
members = [
  "packages/jef",
  "packages/jef-core",
  "packages/jef-scene",
  "packages/jef-sdk-python",
  "packages/jef-server",
  "packages/jef-train",
]

[tool.uv.sources]
jef-core  = { workspace = true }
jef-scene = { workspace = true }
jef-train = { workspace = true }
jef-server = { workspace = true }
jef-sdk    = { workspace = true }
jef        = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "httpx>=0.28",
  "robotframework>=7.1",
  "robotframework-requests>=0.9.7",
  # Dev-only so the MCP tests actually run. They are guarded by importorskip,
  # which means that without this they would silently not run in CI at all.
  "mcp>=2.0",
  "jsonschema>=4.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["packages/jef-ui", "packages/jef-sdk-ts", "connectors/n8n"]

[tool.ruff.lint]
# S is flake8-bandit. This is a security team's repository; having the linter
# flag insecure patterns is the point, and it makes the handful of deliberate
# exceptions explicit at their call sites instead of invisible.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]
# RUF001-003 flag fullwidth CJK punctuation as "ambiguous". zh-TW is a
# first-class language in this project, so 。！？（） are correct, not typos.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
  "S101",  # asserts are the point of a test
  "S311",  # test fixtures use random for reproducible synthetic data, not crypto
]
# Robot support libraries: the asserts are importlib loader guards, and these
# files never run in production.
"test/resources/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
# Only packages that currently have code. Each phase adds its own entry when it
# lands; listing an empty directory here fails the whole run.
# Tests are deliberately excluded: they pass raw dict literals on purpose to
# exercise the wire contract, and demanding full annotations there adds noise
# without catching anything.
files = [
  "packages/jef/src",
  "packages/jef-core/src",
  "packages/jef-scene/src",
  "packages/jef-sdk-python/src",
  "packages/jef-server/src",
  "packages/jef-train/src",
]

[tool.pytest.ini_options]
testpaths = ["packages", "connectors/tests", "tests"]
python_files = ["test_*.py"]
# importlib import mode: several packages legitimately have a tests/test_schema.py
# and a tests/test_engine.py, and the default sys.path-based naming collides on
# the bare module name.
addopts = "-q --import-mode=importlib"
