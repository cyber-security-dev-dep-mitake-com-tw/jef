[project]
name = "jef-train"
version = "0.1.0"
description = "JEF training: embedding cache, head training, temperature + conformal calibration"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = ["jef-core", "torch>=2.5", "transformers>=4.46", "scikit-learn>=1.5", "datasets>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jef_train"]
