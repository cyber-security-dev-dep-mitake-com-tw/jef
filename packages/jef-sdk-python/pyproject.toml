[project]
name = "jef-sdk"
version = "0.1.0"
description = "JEF Python SDK: embedded engine + HTTP client"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = ["jef-core", "jef-scene", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jef_sdk"]
