[project]
name = "jef-core"
version = "0.1.0"
description = "JEF core: shared-state encoding, decision head, calibration"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=2.0", "pydantic>=2.9"]

[project.optional-dependencies]
torch = ["torch>=2.5", "transformers>=4.46"]
onnx = ["onnxruntime>=1.20", "tokenizers>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jef_core"]
