[project]
name = "jef-server"
version = "0.1.0"
description = "JEF server: /v1/systemone + /v1/scenes HTTP API"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = ["jef-core", "fastapi>=0.115", "uvicorn[standard]>=0.32", "prometheus-client>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jef_server"]
