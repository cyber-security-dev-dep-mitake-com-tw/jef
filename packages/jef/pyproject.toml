[project]
name = "jef"
version = "0.2.0rc4"
description = "JEF — an open System One decision engine: typed decisions with calibrated confidence, scene gates, and a CLI."
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
# One distribution, four modules: jef_core (engine), jef_scene (gates),
# jef_sdk (embedded + HTTP client), jef_cli. They are always installed
# together — nothing depends on one without the others — so shipping them
# as separate distributions bought nothing but four more PyPI pages.
dependencies = ["numpy>=2.0", "pydantic>=2.9", "pyyaml>=6.0", "httpx>=0.28"]

authors = [{ name = "Mitake Cyber Security Dev Dept" }]
maintainers = [{ name = "dennislee928" }]
readme = "README.md"
keywords = ["jev", "typesafe", "system-one", "decision", "calibration", "soar", "zh-TW"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/cyber-security-dev-dep-mitake-com-tw/jef"
Repository = "https://github.com/cyber-security-dev-dep-mitake-com-tw/jef"
Documentation = "https://github.com/cyber-security-dev-dep-mitake-com-tw/jef/blob/main/README.md"
Changelog = "https://github.com/cyber-security-dev-dep-mitake-com-tw/jef/releases"
Issues = "https://github.com/cyber-security-dev-dep-mitake-com-tw/jef/issues"
"Results & benchmarks" = "https://github.com/cyber-security-dev-dep-mitake-com-tw/jef/blob/main/docs/RESULTS.md"

[project.optional-dependencies]
# The real backbone. Without it `--local` runs the deterministic test stub,
# which answers in the right shape and means nothing.
torch = ["torch>=2.5", "transformers>=4.46"]
onnx = ["onnxruntime>=1.20", "tokenizers>=0.20"]
server = ["jef-server==0.2.0rc4"]
mcp = ["mcp>=1.2"]
train = ["jef-train==0.2.0rc4"]
all = [
  "torch>=2.5",
  "transformers>=4.46",
  "jef-server==0.2.0rc4",
  "jef-train==0.2.0rc4",
  "mcp>=1.2",
]

[project.scripts]
jef = "jef_cli.__main__:main"
jef-mcp = "jef_cli.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jef_core", "src/jef_scene", "src/jef_sdk", "src/jef_cli"]
