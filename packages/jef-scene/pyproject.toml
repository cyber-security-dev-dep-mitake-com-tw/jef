[project]
name = "jef-scene"
version = "0.1.0"
description = "JEF scene: YAML DAG gates, expression sandbox, decision trace"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = ["jef-core", "pyyaml>=6.0", "pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jef_scene"]
